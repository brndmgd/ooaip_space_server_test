name: AppServer CI

on:
  pull_request:
    branches: ["master"]

env:
  DIR: ./
  DOTNET_VERSION: '7.0.x'

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        working-directory: ${{ env.DIR }}
        run: dotnet restore

      - name: Build
        working-directory: ${{ env.DIR }}
        run: dotnet build --configuration Debug --no-restore /p:ContinuousIntegrationBuild=true

      - name: Test with coverage
        working-directory: ${{ env.DIR }}
        continue-on-error: true
        run: |
          mkdir -p coverage
          dotnet test --configuration Debug \
            --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=coverage/coverage.opencover.xml \
            --logger "trx;LogFileName=test-results.trx" || echo "No tests found, skipping coverage"

      - name: Upload coverage to Codecov
        if: hashFiles('coverage/coverage.opencover.xml') != ''
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.opencover.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

      - name: Create coverage badge
        if: github.event.pull_request.head.repo.full_name == github.repository && hashFiles('coverage/coverage.opencover.xml') != ''
        continue-on-error: true
        uses: simon-k/dotnet-code-coverage-badge@v1.0.0
        id: create_coverage_badge
        with:
          label: Code Coverage
          color: brightgreen
          path: coverage/coverage.opencover.xml
          gist-filename: code-coverage-${{ github.event.pull_request.number }}.json
          gist-id: ${{ secrets.COVERAGE_GIST_ID }}
          gist-auth-token: ${{ secrets.GIST_SECRET }}

      - name: Print coverage summary
        if: hashFiles('coverage/coverage.opencover.xml') != ''
        run: |
          echo "### Code Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "Coverage: ${{ steps.create_coverage_badge.outputs.percentage }}%" >> $GITHUB_STEP_SUMMARY